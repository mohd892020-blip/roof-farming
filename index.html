<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#7ec8f0">
  <meta name="color-scheme" content="light">
  <title>سطحي الأخضر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- الشريط العلوي -->
    <header class="hud">
      <button class="pill level-pill" id="levelPill" aria-label="المستوى والخبرة">
        <span class="level-star"><b id="levelNum">1</b></span>
        <span class="meter"><span class="meter-fill xp" id="xpFill"></span></span>
      </button>
      <button class="pill energy-pill" id="energyPill" aria-label="الطاقة">
        <span class="energy-icon">⚡</span>
        <span class="stack">
          <b id="energyText">30/30</b>
          <span class="meter"><span class="meter-fill energy" id="energyFill"></span></span>
        </span>
      </button>
      <div class="pill coins-pill" id="coinsPill" aria-label="العملات">
        <span class="coin"></span>
        <b id="coinCount">0</b>
      </div>
    </header>

    <!-- منظر السطح -->
    <main class="scene" id="scene">
      <div class="sky-area">
        <div class="sun"></div>
        <button class="gear-btn" id="gearBtn" aria-label="منطقة الأهل">⚙️</button>
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>

        <!-- بيوت الحي في الخلفية -->
        <svg class="city" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
          <path d="M0 120 Q60 88 130 104 T260 96 T400 100 V150 H0Z" fill="#b8d9a8" opacity=".7"/>
          <!-- مئذنة -->
          <rect x="300" y="40" width="10" height="80" fill="#efe3cf"/>
          <rect x="297" y="62" width="16" height="5" rx="2" fill="#d9c7a8"/>
          <path d="M300 40 L305 26 L310 40Z" fill="#7fb3a5"/>
          <circle cx="305" cy="22" r="2.5" fill="#e7c25a"/>
          <!-- بيوت -->
          <g>
            <rect x="-5" y="78" width="70" height="72" fill="#f2d7b0"/>
            <rect x="8" y="92" width="10" height="13" rx="2" fill="#8fc3dd"/><rect x="28" y="92" width="10" height="13" rx="2" fill="#8fc3dd"/><rect x="48" y="92" width="10" height="13" rx="2" fill="#8fc3dd"/>
            <rect x="8" y="118" width="10" height="13" rx="2" fill="#8fc3dd"/><rect x="28" y="118" width="10" height="13" rx="2" fill="#8fc3dd"/>
            <rect x="40" y="64" width="16" height="14" rx="3" fill="#4b5563"/><rect x="38" y="62" width="20" height="4" rx="2" fill="#374151"/>
          </g>
          <g>
            <rect x="62" y="96" width="62" height="54" fill="#e8c9a0"/>
            <rect x="72" y="106" width="9" height="12" rx="2" fill="#a3d2e8"/><rect x="90" y="106" width="9" height="12" rx="2" fill="#a3d2e8"/><rect x="108" y="106" width="9" height="12" rx="2" fill="#a3d2e8"/>
            <rect x="62" y="92" width="62" height="5" fill="#d8b588"/>
          </g>
          <g>
            <rect x="122" y="66" width="56" height="84" fill="#f7e6c8"/>
            <rect x="132" y="78" width="10" height="14" rx="5" fill="#8fc3dd"/><rect x="156" y="78" width="10" height="14" rx="5" fill="#8fc3dd"/>
            <rect x="132" y="104" width="10" height="14" rx="5" fill="#8fc3dd"/><rect x="156" y="104" width="10" height="14" rx="5" fill="#8fc3dd"/>
            <rect x="122" y="62" width="56" height="5" fill="#e3cca5"/>
            <circle cx="135" cy="56" r="6" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
          </g>
          <g>
            <rect x="176" y="88" width="70" height="62" fill="#efcfa6"/>
            <rect x="188" y="100" width="12" height="12" rx="2" fill="#a3d2e8"/><rect x="212" y="100" width="12" height="12" rx="2" fill="#a3d2e8"/>
            <rect x="188" y="124" width="12" height="12" rx="2" fill="#a3d2e8"/><rect x="212" y="124" width="12" height="12" rx="2" fill="#a3d2e8"/>
            <rect x="225" y="74" width="14" height="14" rx="3" fill="#e5e7eb"/><rect x="223" y="72" width="18" height="4" rx="2" fill="#cbd5e1"/>
          </g>
          <g>
            <rect x="244" y="104" width="52" height="46" fill="#f4dcc0"/>
            <rect x="254" y="114" width="9" height="11" rx="2" fill="#8fc3dd"/><rect x="274" y="114" width="9" height="11" rx="2" fill="#8fc3dd"/>
          </g>
          <g>
            <rect x="312" y="82" width="92" height="68" fill="#e9d0ae"/>
            <rect x="324" y="94" width="10" height="13" rx="2" fill="#a3d2e8"/><rect x="346" y="94" width="10" height="13" rx="2" fill="#a3d2e8"/><rect x="368" y="94" width="10" height="13" rx="2" fill="#a3d2e8"/>
            <rect x="324" y="120" width="10" height="13" rx="2" fill="#a3d2e8"/><rect x="346" y="120" width="10" height="13" rx="2" fill="#a3d2e8"/>
            <path d="M380 82 V70 M372 70 H392" stroke="#9ca3af" stroke-width="2"/>
          </g>
        </svg>

        <!-- لافتة اسم السطح -->
        <button class="sign" id="roofSign" aria-label="تغيير اسم السطح">
          <span class="rope r1"></span><span class="rope r2"></span>
          <span class="sign-board"><span id="roofName">سطحي الأخضر</span> <span class="pen">✏️</span></span>
        </button>

        <div class="pigeon-lane" id="pigeonLane" aria-hidden="true"></div>
        <button class="map-btn" id="mapBtn" aria-label="خريطة المراحل">🗺️</button>
      </div>

      <div class="floor-area">
        <div class="tiles" aria-hidden="true"></div>
        <div class="back-wall" aria-hidden="true"></div>

        <!-- ديكور ثابت -->
        <svg class="decor tank" viewBox="0 0 80 100" aria-hidden="true">
          <path d="M14 62 L10 98 M66 62 L70 98 M24 62 L22 96 M56 62 L58 96" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
          <path d="M12 84 H68" stroke="#6b7280" stroke-width="3"/>
          <rect x="8" y="58" width="64" height="7" rx="2" fill="#4b5563"/>
          <rect x="10" y="14" width="60" height="46" rx="10" fill="#2f3b4c"/>
          <rect x="10" y="26" width="60" height="4" fill="#3d4b60"/><rect x="10" y="42" width="60" height="4" fill="#3d4b60"/>
          <rect x="16" y="18" width="7" height="36" rx="3.5" fill="#53647d" opacity=".8"/>
          <rect x="30" y="7" width="20" height="9" rx="3" fill="#1f2937"/>
          <path d="M70 50 Q80 50 78 66" stroke="#9ca3af" stroke-width="3" fill="none"/>
        </svg>

        <svg class="decor dish" viewBox="0 0 70 70" aria-hidden="true">
          <path d="M36 40 L42 66 M30 66 H54" stroke="#9ca3af" stroke-width="4" stroke-linecap="round"/>
          <ellipse cx="30" cy="30" rx="22" ry="26" transform="rotate(-30 30 30)" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
          <ellipse cx="30" cy="30" rx="12" ry="15" transform="rotate(-30 30 30)" fill="#e2e8f0"/>
          <path d="M30 30 L50 14" stroke="#94a3b8" stroke-width="3"/>
          <circle cx="51" cy="13" r="4" fill="#64748b"/>
        </svg>

        <svg class="decor clothesline" viewBox="0 0 200 80" preserveAspectRatio="none" aria-hidden="true">
          <path d="M8 80 V12 M2 12 H14 M192 80 V12 M186 12 H198" stroke="#8b6b4a" stroke-width="4" stroke-linecap="round"/>
          <path d="M8 14 Q100 30 192 14" stroke="#e5e7eb" stroke-width="1.5" fill="none"/>
          <g class="clothes">
            <path d="M34 19 h22 l6 8 -6 3 v18 h-22 v-18 l-6 -3z" fill="#f87171"/>
            <rect x="74" y="22" width="16" height="22" rx="2" fill="#60a5fa"/>
            <path d="M104 24 h12 v14 l6 6 -5 3 -8 -8 h-5z" fill="#fbbf24"/>
            <path d="M134 22 h24 v26 h-24z" fill="#a78bfa"/><path d="M134 22 l12 10 12 -10" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
            <path d="M170 18 h10 v16 l5 5 -4 3 -6 -7 h-5z" fill="#34d399"/>
          </g>
        </svg>

        <!-- الفزاعة: مكافأة حارس السطح -->
        <svg class="decor scarecrow" id="scarecrow" viewBox="0 0 70 100" aria-hidden="true" hidden>
          <path d="M35 34 V98" stroke="#8b5a2b" stroke-width="5" stroke-linecap="round"/>
          <path d="M6 46 H64" stroke="#8b5a2b" stroke-width="4" stroke-linecap="round"/>
          <path d="M18 44 h34 l4 30 h-42z" fill="#e2574c"/>
          <path d="M18 44 h34 l4 30 h-42z" fill="url(#plaid)" opacity=".5"/>
          <path d="M8 44 h12 v9 h-12z M50 44 h12 v9 h-12z" fill="#e2574c"/>
          <path d="M4 46 l5 -3 M4 50 l5 1 M66 46 l-5 -3 M66 50 l-5 1" stroke="#e9c46a" stroke-width="2.5" stroke-linecap="round"/>
          <rect x="30" y="72" width="10" height="8" fill="#4a6fa5"/>
          <circle cx="35" cy="32" r="12" fill="#e9d3a1"/>
          <circle cx="31" cy="30" r="1.8" fill="#3b2a1a"/><circle cx="39" cy="30" r="1.8" fill="#3b2a1a"/>
          <path d="M29 36 Q35 41 41 36" stroke="#3b2a1a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <circle cx="27" cy="34" r="2" fill="#f4a29a"/><circle cx="43" cy="34" r="2" fill="#f4a29a"/>
          <ellipse cx="35" cy="22" rx="20" ry="4" fill="#d9a441"/>
          <path d="M24 22 Q26 8 35 8 Q44 8 46 22z" fill="#e9b949"/>
          <rect x="25" y="17" width="20" height="3" fill="#c0392b"/>
          <defs><pattern id="plaid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 4 H8 M4 0 V8" stroke="#7a1f17" stroke-width="1.5"/></pattern></defs>
        </svg>

        <button class="water-btn" id="waterBtn" aria-label="السقاية">
          <span class="water-icon">💧</span>
          <span class="water-label">اسقِ</span>
        </button>

        <div class="plots" id="plots"></div>
        <div class="front-ledge" aria-hidden="true"></div>
      </div>

      <div class="bird-layer" id="birdLayer" aria-hidden="true"></div>
      <div class="mode-banner" id="modeBanner" hidden>
        <span id="modeText"></span>
        <button class="mode-close" id="modeClose" aria-label="إلغاء">✕</button>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="fact-card" id="factCard" role="status" aria-live="polite"></div>
    </main>

    <!-- الشريط السفلي -->
    <nav class="bottom-bar">
      <button class="nav-btn" id="btnShop">
        <span class="nav-icon">🏪</span><span>المتجر</span>
        <span class="badge" id="shopBadge" hidden>0</span>
      </button>
      <button class="nav-btn primary" id="btnSeeds">
        <span class="nav-icon">🌱</span><span>بذور</span>
      </button>
      <button class="nav-btn" id="btnUpgrade">
        <span class="nav-icon">🔨</span><span>ترقية</span>
        <span class="badge dot" id="upgradeBadge" hidden></span>
      </button>
    </nav>

    <!-- القوائم المنبثقة -->
    <div class="sheet-overlay" id="sheetOverlay" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <header class="sheet-head">
          <h2 id="sheetTitle"></h2>
          <button class="sheet-close" id="sheetClose" aria-label="إغلاق">✕</button>
        </header>
        <div class="sheet-body" id="sheetBody"></div>
      </section>
    </div>

    <!-- شاشة القفل: النوم، المدرسة، انتهاء الوقت -->
    <div class="lock-screen" id="lockScreen" hidden></div>

    <!-- منطقة الأهل -->
    <div class="parent-overlay" id="parentOverlay" hidden>
      <header class="map-head">
        <div class="map-title"><h2>منطقة الأهل ⚙️</h2></div>
        <button class="sheet-close" id="parentClose" aria-label="إغلاق">✕</button>
      </header>
      <div class="parent-body" id="parentBody"></div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>

    <!-- خريطة المراحل -->
    <div class="map-overlay" id="mapOverlay" hidden>
      <header class="map-head">
        <div class="map-title">
          <h2>خريطة السطوح 🗺️</h2>
          <div class="map-progress" id="mapProgress"></div>
        </div>
        <button class="sheet-close" id="mapClose" aria-label="إغلاق">✕</button>
      </header>
      <div class="map-scroll" id="mapScroll">
        <div class="map-canvas" id="mapCanvas"></div>
      </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" hidden>
      <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
    </div>

    <div class="fx-layer" id="fx" aria-hidden="true"></div>
  </div>

  <script src="data.js" defer></script>
  <script src="state.js" defer></script>
  <script src="game.js" defer></script>
  <script src="parent.js" defer></script>
  <script src="ui.js" defer></script>
  <script src="birds.js" defer></script>
  <script src="map.js" defer></script>
</body>
</html>
